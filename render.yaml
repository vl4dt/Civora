services:
  - type: web
    name: civora-staging
    runtime: elixir
    plan: free
    region: oregon
    branch: main
    buildCommand: ./bin/render-build.sh
    startCommand: _build/prod/rel/civora/bin/render-start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: civora-staging-db
          property: connectionString
      - key: SECRET_KEY_BASE
        sync: false
      - key: ELIXIR_VERSION
        value: 1.20.1
      - key: POOL_SIZE
        value: 5
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: civora-staging-db
    databaseName: civora_staging
    user: civora
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []
